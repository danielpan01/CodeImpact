name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make setup
      - run: make check
      - run: npm run format:check
        working-directory: web
      - name: Offline authored evaluation
        run: make evaluate
      - name: Offline real-source v1 evaluation
        run: make evaluate-real
      - name: Offline fresh-source v2 evaluation
        run: make evaluate-real-v2
      - name: Offline fresh-source v3 evaluation
        run: make evaluate-real-v3
      - name: Offline fresh-source v4 evaluation
        run: make evaluate-real-v4
      - name: Offline v4 unittest discovery evaluation
        run: make evaluate-real-v4-unittest
      - name: Offline v4 guarded variadic dispatch evaluation
        run: make evaluate-real-v4-variadic
      - name: Offline v4 inline parameter row evaluation
        run: make evaluate-real-v4-parameter-rows
      - name: Offline v4 explicit re-export evidence evaluation
        run: make evaluate-real-v4-reexports
      - name: Offline source-traceable v5 evaluation
        run: make evaluate-real-v5
      - name: Verify protected local deployment
        run: make verify-pilot
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: web
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results/
  ui-quality:
    # Match the native ARM64 baseline environment, independently of the existing
    # cross-browser/API/evaluation job. The container pins OS/fonts/browser.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Canonical visual comparisons (never update baselines)
        run: npm run quality:container -- visual
        working-directory: web
      - name: Rendered WCAG A/AA checks
        if: ${{ !cancelled() }}
        run: npm run quality:container -- a11y
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ui-quality-results
          path: web/test-results/quality/
